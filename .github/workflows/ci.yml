name: CI
on:
  push:
    branches:
      - experimental
      - beta
      - stable
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh

  site-check:
    # Prepares Gluon at GLUON_GIT_REF (clone, apply patches/, update feeds)
    # and runs `make config`, which validates site.conf, all domains/*.conf
    # and the package selection for one target. No firmware is built.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GLUON_TARGET: x86-64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ecdsautils file gawk git libelf-dev \
            libncurses5-dev libssl-dev llvm python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync swig \
            time unzip wget zlib1g-dev

      - name: Prepare Gluon (clone, patch, update)
        run: make gluon-prepare

      - name: Validate site and target config
        run: make -C gluon-build GLUON_TARGET="$GLUON_TARGET" config
